# Este arquivo é a configuração de CI/CD para seu projeto no GitLab.
# Configurado para usar SonarCloud.

# Definição dos serviços que serão executados em containers separados.
services:
  - name: postgres:15
    alias: postgres_db
    variables:
      POSTGRES_DB: teste
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

# Definição dos estágios do pipeline, na ordem de execução.
stages:
  - build
  - test
  - analyze
  - deploy

# Variáveis globais para o pipeline.
variables:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_db:5432/teste
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: postgres

  SONAR_HOST_URL: https://sonarcloud.io
  SONAR_ORGANIZATION: "seu_id_da_organizacao_no_sonarcloud" # <-- MUDE ISTO!
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"

# Job para a fase de build.
build-job:
  stage: build
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - echo "Compiling the code..."
    - mvn compile
    - echo "Compile complete."
  cache:
    key: "${CI_COMMIT_REF_SLUG}"
    paths:
      - ~/.m2/repository
    policy: push # Adicionado para garantir que o cache é salvo após o build

# Job para a fase de testes unitários.
unit-test-job:
  stage: test
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - echo "Running unit tests..."
    - mvn test
    - echo "Unit tests complete."
  cache:
    key: "${CI_COMMIT_REF_SLUG}"
    paths:
      - ~/.m2/repository
    policy: pull

# Job para a análise de qualidade de código com SonarCloud.
sonarcloud-check:
  stage: analyze
  image: maven:3-openjdk-17
  cache:
    # Combine todos os caminhos de cache aqui.
    # O cache para ~/.m2/repository geralmente é suficiente com a mesma key dos jobs anteriores.
    key: "${CI_COMMIT_REF_SLUG}" # Reusa o cache de dependências Maven de outros jobs para este slug
    paths:
      - ~/.m2/repository # Cache das dependências Maven
      - .sonar/cache     # Cache específico do SonarScanner para análises incrementais
    policy: pull # Baixa o cache no início do job
  script:
    - echo "Running SonarCloud analysis..."
    - mvn clean verify sonar:sonar -Dsonar.projectKey=unirio4_api-externo
  only:
    - merge_requests
    - main
    - master
    - develop
  allow_failure: true
  needs:
    - unit-test-job
  # Removida a segunda definição de 'cache' aqui.

# Job para a fase de deploy.
deploy-job:
  stage: deploy
  environment: production
  script:
    - echo "Deploying application..."
    - echo "Application successfully deployed."
  needs:
    - sonarcloud-check